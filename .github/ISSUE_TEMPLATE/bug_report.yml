name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the bridge with ...
        2. Open the dashboard and ...
  - type: input
    id: version
    attributes:
      label: Webcam Bridge version
      placeholder: "webcam-bridge --version"
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop OS and how you installed
      placeholder: Windows 11, installer / pipx / source
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
      placeholder: Pixel 7, Android 14
  - type: textarea
    id: doctor
    attributes:
      label: webcam-bridge doctor
      description: Run `webcam-bridge doctor` (or **Webcam Bridge (troubleshoot)** in the Start menu) and paste the output.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `--no-tui` and paste the relevant output.
      render: text
