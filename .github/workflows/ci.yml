name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vcam:
    name: Virtual camera DLL (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - { arch: x64, platform: x64 }
          - { arch: x86, platform: Win32 }
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S vcam/windows -B build/vcam -A ${{ matrix.platform }}
      - run: cmake --build build/vcam --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: vcam-${{ matrix.arch }}
          path: build/vcam/Release/webcam_bridge_cam.dll
          if-no-files-found: error

  desktop:
    name: Desktop (Python ${{ matrix.python }})
    needs: vcam
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vcam-x64
          path: desktop/webcam_bridge/bin/x64
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: desktop/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug lint
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
