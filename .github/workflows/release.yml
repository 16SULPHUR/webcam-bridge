name: Release

# Push a tag like v0.2.0 to publish a release with the APK, the one-click
# Windows installer, the desktop zip (virtual camera DLLs included) and the
# standalone camera DLL zip.
# Optional repository secrets for a properly signed APK:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key (installable, but
# users must uninstall before updating to a differently signed build).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  vcam:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - { arch: x64, platform: x64 }
          - { arch: x86, platform: Win32 }
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S vcam/windows -B build/vcam -A ${{ matrix.platform }}
      - run: cmake --build build/vcam --config Release
      - uses: actions/upload-artifact@v7
        with:
          name: vcam-${{ matrix.arch }}
          path: build/vcam/Release/webcam_bridge_cam.dll
          if-no-files-found: error

  installer:
    name: Windows installer
    needs: vcam
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vcam-x64
          path: desktop/webcam_bridge/bin/x64
      - uses: actions/download-artifact@v8
        with:
          name: vcam-x86
          path: desktop/webcam_bridge/bin/x86
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop/pyproject.toml
      - name: Install the bridge and PyInstaller
        working-directory: desktop
        run: |
          python -m pip install --upgrade pip
          pip install -e . "pyinstaller>=6.6"
      - name: Fetch the redistributable FFmpeg
        working-directory: desktop
        run: python packaging/fetch_ffmpeg.py
      - name: Freeze the app
        working-directory: desktop
        run: pyinstaller packaging/webcam-bridge.spec --noconfirm
      - name: Smoke-test the frozen app
        working-directory: desktop
        run: |
          # A windowed exe detaches from the shell, so wait for it explicitly.
          $app = Start-Process -FilePath dist\WebcamBridge\WebcamBridge.exe `
            -ArgumentList "camera","status" -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "frozen app exited with $($app.ExitCode)" }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$version packaging\windows\webcam-bridge.iss
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/WebcamBridge-Setup-*.exe
          if-no-files-found: error

  release:
    needs: [vcam, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: vcam-*
          path: vcam-dist
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: installer-dist

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets configured; APK will be debug-signed."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Package artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/webcam-bridge-${VERSION}.apk"
          cp installer-dist/WebcamBridge-Setup-*.exe dist/
          # Standalone camera DLLs: x64/ and x86/webcam_bridge_cam.dll
          mkdir -p staging/x64 staging/x86
          cp vcam-dist/vcam-x64/webcam_bridge_cam.dll staging/x64/
          cp vcam-dist/vcam-x86/webcam_bridge_cam.dll staging/x86/
          (cd staging && zip -q -r ../dist/webcam-bridge-vcam.zip x64 x86)

          # Desktop zip: tracked sources plus the prebuilt DLLs
          PREFIX="webcam-bridge-${VERSION}"
          git archive --format=zip --prefix="${PREFIX}/" \
            -o "dist/webcam-bridge-desktop-${VERSION}.zip" HEAD \
            desktop scripts docs vcam README.md LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md
          mkdir -p "zipadd/${PREFIX}/desktop/webcam_bridge/bin"
          cp -r staging/x64 staging/x86 "zipadd/${PREFIX}/desktop/webcam_bridge/bin/"
          (cd zipadd && zip -q -r "../dist/webcam-bridge-desktop-${VERSION}.zip" "${PREFIX}")
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Webcam Bridge $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
